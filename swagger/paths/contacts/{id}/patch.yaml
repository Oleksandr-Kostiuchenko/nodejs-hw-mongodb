tags:
  - Contacts
summary: Update contact by ID
operationId: patchContact
description: Update information about contact using its ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/from-data:
      schema:
        type: object
        properties:
          name:
            description: Contact name
            type: string
            example: John Doe
          phoneNumber:
            description: Contact phone phoneNumber
            type: string
          isFavourite:
            description: Is contact is Favourite
            type: boolean
          contactType:
            description: Contact type
            type: string
            enum: ['personal', 'home', 'work']
          photo:
            description: Contact photo
            type: string
            format: binary
            example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
          email:
            description: Contact email
            type: string
responses:
  '200':
    description: Update contact by ID
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with 65ca67e7ae7f10c88b598384 ID!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Not found contact by ID
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found!
            data:
              type: object
