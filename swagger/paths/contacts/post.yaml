tags:
  - Contacts
summary: Create contacts
operationId: postContacts
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/from-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - isFavourite
          - contactType
          - userId
        properties:
          name:
            description: Contact name
            type: string
            example: John Doe
          phoneNumber:
            description: Contact phone phoneNumber
            type: string
          isFavourite:
            description: Is contact is Favourite
            type: boolean
          contactType:
            description: Contact type
            type: string
            enum: ['personal', 'home', 'work']
          photo:
            description: Contact photo
            type: string
            format: binary
            example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
          email:
            description: Contact email
            type: string
responses:
  '200':
    description: Creates contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact successfully created!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
