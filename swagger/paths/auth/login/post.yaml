tags:
  - Auth
summary: Login user
operationId: authLogin
description: Use credentials to login user
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            example: test@gmail.com
          password:
            type: string
            example: 12345
responses:
  '200':
    description: Login user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Logined user successfully!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: uBRSiZ9Z1vo4N/r5T6JuK6diyYxSkN4nwBX
  '401':
    description: Unauthorized error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: UnauthorizedError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: UnauthorizedError
