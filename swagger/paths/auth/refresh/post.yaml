tags:
  - Auth
summary: Refresh user session
operationId: authRefresh
description: Use accessToken to refresh user
security:
  - bearerAuth: []
parameters:
  - in: cookie
    name: refreshToken
    required: true
    schema:
      type: string
      example: 'QAixX2FiCk+4CxiCd/PK266rpR55ABoUd+wRYN'
  - in: cookie
    name: sessionId
    required: true
    schema:
      type: string
      example: 'A%22685084d96a533d98d9623f0d'
responses:
  '200':
    description: Refresh user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Refreshed user successfully!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: uBRSiZ9Z1vo4N/r5T6JuK6diyYxSkN4nwBX
  '401':
    description: Unauthorized error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: UnauthorizedError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: UnauthorizedError
